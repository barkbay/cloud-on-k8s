# This sample demonstrates remote cluster connections between stateful and stateless Elasticsearch clusters.
# It creates:
# - A stateful Elasticsearch cluster (es1) in namespace ns1
# - A stateless Elasticsearch cluster (es1) in namespace ns2
# - Cross-cluster search configured from stateful to stateless using the Kind field

---
apiVersion: v1
kind: Namespace
metadata:
  name: ns1
---
apiVersion: v1
kind: Namespace
metadata:
  name: ns2
---
apiVersion: elasticsearch.k8s.elastic.co/v1alpha1
kind: ElasticsearchStateless
metadata:
  name: es1 # Same name as the stateful cluster to demonstrate cross-kind remote clusters
  namespace: ns1
spec:
  monitoring:
    metrics:
      elasticsearchRefs:
        - name: es1
          namespace: ns2
          kind: ElasticsearchStateless
    logs:
      elasticsearchRefs:
        - name: es1
          namespace: ns2
          kind: ElasticsearchStateless
  version: 9.2.2
  objectStore:
    bucket: foo
    client: s3-client
    type: s3
  tiers:
    index:
      config:
        node.store.allow_mmap: false
      count: 1
    search:
      config:
        node.store.allow_mmap: false
      count: 2
    ml:
      count: 0
---
apiVersion: elasticsearch.k8s.elastic.co/v1alpha1
kind: ElasticsearchStateless
metadata:
  name: es1
  namespace: ns2
spec:
  version: 9.2.2
  objectStore:
    bucket: foo
    client: s3-client
    type: s3
  tiers:
    index:
      config:
        node.store.allow_mmap: false
      count: 1
    search:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
      config:
        node.store.allow_mmap: false
      count: 3
    ml:
      count: 0
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: k1
  namespace: ns2
spec:
  version: 9.2.2
  count: 1
  elasticsearchRef:
    name: "es1"
    kind: ElasticsearchStateless